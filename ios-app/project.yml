name: Arkive
options:
  bundleIdPrefix: life.arkive
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
targets:
  Arkive:
    type: application
    platform: iOS
    sources:
      - path: Arkive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: life.arkive.ios
        INFOPLIST_FILE: Arkive/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_BITCODE: NO
