<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-label="Arkive Secure Appliance" fill="none">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2230"/>
      <stop offset="1" stop-color="#070a10"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141a25"/>
      <stop offset="1" stop-color="#0a0e15"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#05080f"/>
    </linearGradient>
    <linearGradient id="led" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fa8ff"/>
      <stop offset="1" stop-color="#2f6bff"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f7cff"/>
      <stop offset="1" stop-color="#35d0a5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#4f7cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4f7cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- ambient glow + shadow -->
  <ellipse cx="480" cy="596" rx="360" ry="30" fill="#000" opacity="0.5" filter="url(#soft)"/>
  <rect x="120" y="40" width="720" height="520" rx="26" fill="url(#glow)"/>

  <!-- chassis -->
  <rect x="150" y="70" width="660" height="480" rx="22" fill="url(#body)" stroke="#2a3547" stroke-width="2"/>
  <rect x="168" y="88" width="624" height="444" rx="16" fill="url(#face)" stroke="#1c2534" stroke-width="1.5"/>

  <!-- left ventilation grille -->
  <g clip-path="url(#grille)">
    <clipPath id="grille"><rect x="188" y="110" width="230" height="400" rx="12"/></clipPath>
    <rect x="188" y="110" width="230" height="400" rx="12" fill="#0a0e15"/>
    <g stroke="#243043" stroke-width="9">
      <line x1="170" y1="150" x2="300" y2="30"/>
      <line x1="170" y1="190" x2="340" y2="30"/>
      <line x1="170" y1="230" x2="380" y2="30"/>
      <line x1="170" y1="270" x2="420" y2="60"/>
      <line x1="170" y1="310" x2="440" y2="100"/>
      <line x1="170" y1="350" x2="440" y2="140"/>
      <line x1="170" y1="390" x2="440" y2="180"/>
      <line x1="170" y1="430" x2="440" y2="220"/>
      <line x1="170" y1="470" x2="440" y2="260"/>
      <line x1="200" y1="510" x2="440" y2="300"/>
      <line x1="260" y1="520" x2="440" y2="340"/>
      <line x1="320" y1="520" x2="440" y2="380"/>
    </g>
  </g>
  <!-- glowing brand triangle on the grille -->
  <g transform="translate(303 300)">
    <path d="M0 -46 L40 34 L0 14 L-40 34 Z" fill="url(#led)"/>
    <path d="M0 -46 L0 14 L-40 34 Z" fill="#8fb6ff" opacity="0.85"/>
    <text x="0" y="78" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" letter-spacing="6" font-weight="700" fill="#dfe8ff">ARKIVE</text>
  </g>

  <!-- status screen -->
  <rect x="440" y="120" width="330" height="150" rx="12" fill="url(#screen)" stroke="#22304a" stroke-width="1.5"/>
  <!-- screen: logo + tagline -->
  <g transform="translate(470 150)">
    <path d="M0 -14 L14 12 L0 5 L-14 12 Z" fill="url(#led)"/>
    <text x="30" y="6" font-family="Segoe UI, Arial, sans-serif" font-size="18" letter-spacing="3" font-weight="700" fill="#eaf1ff">ARKIVE</text>
    <text x="0" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#8ea0bd">Your Digital Legacy.</text>
    <text x="0" y="43" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#8ea0bd">Protected Forever.</text>
  </g>
  <!-- screen: system status -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#c4d0e4">
    <text x="600" y="150">System Status</text>
    <g fill="#aeb9cc">
      <text x="600" y="172">Vault Secure</text>
      <text x="600" y="190">Network Connected</text>
      <text x="600" y="208">Backups Running</text>
      <text x="600" y="226">Hardware Healthy</text>
    </g>
    <g fill="#35d0a5">
      <circle cx="748" cy="168" r="3.5"/>
      <circle cx="748" cy="186" r="3.5"/>
      <circle cx="748" cy="204" r="3.5"/>
      <circle cx="748" cy="222" r="3.5"/>
    </g>
  </g>
  <!-- screen: storage usage bar -->
  <g transform="translate(470 236)">
    <text x="0" y="0" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#8ea0bd">Storage Usage</text>
    <rect x="0" y="8" width="210" height="8" rx="4" fill="#1a2536"/>
    <rect x="0" y="8" width="60" height="8" rx="4" fill="url(#bar)"/>
    <text x="230" y="16" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#eaf1ff">28%</text>
  </g>

  <!-- control buttons -->
  <g transform="translate(452 292)">
    <g fill="#111823" stroke="#28344a" stroke-width="1.2">
      <rect x="0" y="0" width="52" height="26" rx="7"/>
      <rect x="62" y="0" width="52" height="26" rx="7"/>
      <rect x="124" y="0" width="52" height="26" rx="7"/>
      <rect x="186" y="0" width="52" height="26" rx="7"/>
      <rect x="248" y="0" width="52" height="26" rx="7"/>
    </g>
    <g fill="#6f7f96" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle">
      <text x="26" y="18">⌂</text>
      <text x="88" y="18">↩</text>
      <text x="150" y="18">∧</text>
      <text x="212" y="18">∨</text>
      <text x="274" y="18">⚙</text>
    </g>
  </g>

  <!-- 5 drive bays -->
  <g transform="translate(452 336)">
    <g>
      <!-- bay template repeated -->
      <g>
        <rect x="0" y="0" width="52" height="176" rx="8" fill="#0c1017" stroke="#26324a" stroke-width="1.4"/>
        <rect x="10" y="12" width="6" height="120" rx="3" fill="url(#led)"/>
        <g fill="#1a2334"><circle cx="26" cy="150" r="9"/></g>
        <text x="26" y="196" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#6f7f96">1</text>
      </g>
      <g transform="translate(62 0)">
        <rect x="0" y="0" width="52" height="176" rx="8" fill="#0c1017" stroke="#26324a" stroke-width="1.4"/>
        <rect x="10" y="12" width="6" height="120" rx="3" fill="url(#led)"/>
        <g fill="#1a2334"><circle cx="26" cy="150" r="9"/></g>
        <text x="26" y="196" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#6f7f96">2</text>
      </g>
      <g transform="translate(124 0)">
        <rect x="0" y="0" width="52" height="176" rx="8" fill="#0c1017" stroke="#26324a" stroke-width="1.4"/>
        <rect x="10" y="12" width="6" height="120" rx="3" fill="url(#led)"/>
        <g fill="#1a2334"><circle cx="26" cy="150" r="9"/></g>
        <text x="26" y="196" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#6f7f96">3</text>
      </g>
      <g transform="translate(186 0)">
        <rect x="0" y="0" width="52" height="176" rx="8" fill="#0c1017" stroke="#26324a" stroke-width="1.4"/>
        <rect x="10" y="12" width="6" height="120" rx="3" fill="url(#led)"/>
        <g fill="#1a2334"><circle cx="26" cy="150" r="9"/></g>
        <text x="26" y="196" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#6f7f96">4</text>
      </g>
      <g transform="translate(248 0)">
        <rect x="0" y="0" width="52" height="176" rx="8" fill="#0c1017" stroke="#26324a" stroke-width="1.4"/>
        <rect x="10" y="12" width="6" height="120" rx="3" fill="url(#led)"/>
        <g fill="#1a2334"><circle cx="26" cy="150" r="9"/></g>
        <text x="26" y="196" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#6f7f96">5</text>
      </g>
    </g>
  </g>

  <!-- ports + power button -->
  <g transform="translate(772 360)">
    <rect x="0" y="0" width="18" height="10" rx="2" fill="#1a2334"/>
    <rect x="0" y="24" width="16" height="12" rx="3" fill="#1a2334"/>
    <circle cx="9" cy="150" r="16" fill="#0c1017" stroke="#2f6bff" stroke-width="2"/>
    <path d="M9 142 v10 M4 146 a7 7 0 1 0 10 0" stroke="#4f7cff" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- feet -->
  <rect x="210" y="548" width="70" height="16" rx="7" fill="#0a0e15" stroke="#2f6bff" stroke-opacity="0.5"/>
  <rect x="680" y="548" width="70" height="16" rx="7" fill="#0a0e15" stroke="#2f6bff" stroke-opacity="0.5"/>
</svg>
